
name: Build VORTEX IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Verify web entry
        run: |
          test -f index.html
          npm run build
          test -f www/index.html

      - name: Install Capacitor iOS
        run: npm install @capacitor/ios@^7.4.3

      - name: Prepare iOS project
        run: |
          if [ ! -d ios/App/App.xcodeproj ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install --repo-update
          cd ../..

      - name: Build iOS app
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/App.app
          /usr/bin/zip -qry VORTEX-unsigned.ipa Payload
          test -f VORTEX-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VORTEX-unsigned-IPA
          path: VORTEX-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
